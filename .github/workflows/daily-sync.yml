# Hosted alternative to schedule/crontab.txt. The run only scrapes, matches and queues proposals:
# it never writes to the CRM, so it is safe to run unattended.
name: Daily Bellhaven sync

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 AM US Central (5:00 AM during standard time)
  workflow_dispatch: {}      # run on demand from the Actions tab

concurrency:
  group: bellhaven-sync      # never two runs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRM_TOKEN: ${{ secrets.CRM_TOKEN }}   # add it under Settings > Secrets > Actions to go live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      # The decision store must survive between runs, or rejected proposals would come back.
      # A cache works for a demo; in production the store lives in a shared database that the
      # review app also uses (see README, "Running it daily").
      - name: No token configured
        if: env.CRM_TOKEN == ''
        run: echo "::notice::CRM_TOKEN secret is not set, so the sync was skipped. Tests ran."

      - name: Restore state
        if: env.CRM_TOKEN != ''
        uses: actions/cache/restore@v4
        with:
          path: state/bellhaven_sync.db
          key: bellhaven-state-${{ github.run_id }}
          restore-keys: bellhaven-state-

      - name: Run pipeline
        if: env.CRM_TOKEN != ''
        run: python -m bellhaven_sync run

      - name: Save state
        if: always() && env.CRM_TOKEN != ''
        uses: actions/cache/save@v4
        with:
          path: state/bellhaven_sync.db
          key: bellhaven-state-${{ github.run_id }}

      - name: Keep the run summary
        if: env.CRM_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: state/last_run.json
