{#- One stroke icon set for the whole app: 24px grid, 1.8 stroke, round caps. -#}
{% macro icon(name, size=16, cls="") -%}
<svg class="i {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'x' %}<path d="M7 7l10 10M17 7L7 17"/>
{%- elif name == 'arrow-left' %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'arrow-right' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'chevron' %}<path d="M9.5 6l6 6-6 6"/>
{%- elif name == 'external' %}<path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/>
{%- elif name == 'refresh' %}<path d="M19.5 10A8 8 0 0 0 5.2 7.5M4.5 4v4h4M4.5 14a8 8 0 0 0 14.3 2.5M19.5 20v-4h-4"/>
{%- elif name == 'globe' %}<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/>
{%- elif name == 'database' %}<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>
{%- elif name == 'shield' %}<path d="M12 3.5l7 2.8v5.2c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.3z"/><path d="M9 12l2.2 2.2L15.5 10"/>
{%- elif name == 'scale' %}<path d="M12 4v16M8 20h8M6 7h12M6 7l-3 6.5a3.2 3.2 0 0 0 6 0zM18 7l-3 6.5a3.2 3.2 0 0 0 6 0z"/>
{%- elif name == 'alert' %}<path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17.2v.1"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/>
{%- elif name == 'inbox' %}<path d="M4 13.5L6.5 6h11l2.5 7.5V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13.5h4.5l1.2 2h4.6l1.2-2H20"/>
{%- elif name == 'copy' %}<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- endif %}</svg>
{%- endmacro %}
